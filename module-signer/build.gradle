// Gradle build file for module-signer (alternative to Maven)
// This allows building the module-signer without Maven

plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-cli:commons-cli:1.3.1'
    implementation 'commons-io:commons-io:2.1'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.inductiveautomation.ignitionsdk.ModuleSigner$Main'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    archiveBaseName = 'module-signer'
    archiveVersion = '1.0.0'
    archiveClassifier = 'jar-with-dependencies'
}

